<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城木獵人 Dendro-Hunter</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; overflow: hidden; background-color: #000; }
        #map { width: 100%; height: 100%; z-index: 1; }

        /* 3D 容器與虛擬搖桿 */
        #scene3d-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; background: #87CEEB; }
        #scene3d { width: 100%; height: 100%; touch-action: none; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; z-index: 501; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); z-index: 501; pointer-events: none; display: none; }
        
        #tree-info-panel { display: none; position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.95); padding: 12px 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 2px solid #27ae60; z-index: 1000; text-align: center; pointer-events: none; min-width: 200px; }
        #tree-info-panel h4 { margin: 0 0 5px 0; color: #27ae60; font-size: 18px; }
        #tree-info-panel p { margin: 0; color: #555; font-size: 13px; font-style: italic; }

        /* 右上角按鈕群 (設定、視角切換、離開) */
        #settings-btn { position: absolute; top: 12px; right: 12px; z-index: 1000; background: rgba(255, 255, 255, 0.95); border: 2px solid #27ae60; padding: 10px 14px; border-radius: 12px; font-size: 15px; font-weight: bold; color: #27ae60; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .top-right-btn { display: none; position: absolute; right: 12px; z-index: 1000; color: white; border: none; padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #switch-view-btn { top: 12px; background: #3498db; border: 2px solid #2980b9; }
        #leave-park-btn { top: 60px; background: #e74c3c; border: 2px solid #c0392b; }

        #settings-panel { display: none; position: absolute; top: 65px; right: 12px; background: rgba(255, 255, 255, 0.96); padding: 14px 16px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.18); z-index: 1000; width: 280px; border: 2px solid #27ae60; font-size: 14px; }
        #settings-panel.show { display: block; }
        #settings-panel h3 { margin: 0 0 12px 0; color: #1e8449; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 8px;}
        #gps-status-box { background: #f0f3f4; padding: 10px; border-radius: 8px; font-size: 13px; color: #333; margin-bottom: 12px; word-wrap: break-word; border: 1px solid #dcdcdc;}
        .dev-control { margin-bottom: 12px; }
        .dev-control label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        select, input[type="text"] { width: 100%; padding: 8px 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }
        #reset-game-btn { width: 100%; padding: 10px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; }
        #reset-game-btn:active { transform: scale(0.95); }

        /* 左下角：回到目前定位按鈕 */
        #locate-btn { position: absolute; bottom: 20px; left: 16px; z-index: 1000; background: rgba(255,255,255,0.95); border: 2px solid #3498db; border-radius: 50%; width: 48px; height: 48px; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.25); transition: 0.2s; }
        #locate-btn:active { transform: scale(0.9); }

        .player-marker { background-color: #3498db; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 12px rgba(52, 152, 219, 0.9); animation: pulse 1.6s infinite; }
        @keyframes pulse { 0% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.7); } 70% { transform: scale(1.15); box-shadow: 0 0 0 16px rgba(52, 152, 219, 0); } 100% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0); } }
        
        #loading { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.78); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; font-size: 18px; gap: 14px; }
        .spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #2ecc71; border-radius: 50%; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #toast-bar { display: none; position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 2000; max-width: 90%; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* 左上角玩家資源狀態 */
        #stats-panel { position: absolute; top: 12px; left: 12px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none; }
        #fertilizer-display, #species-count { background: rgba(255,255,255,0.95); padding: 7px 13px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #27ae60; box-shadow: 0 3px 12px rgba(0,0,0,0.15); border: 2px solid #2ecc71; pointer-events: auto;}
        #species-count { color: #2980b9; border-color: #3498db; }
        #streak-info { background: rgba(0,0,0,0.75); color: #f1c40f; padding: 5px 11px; border-radius: 16px; font-size: 12px; text-align: center; pointer-events: auto;}

        /* 右下角行動選單 */
        #action-menu-btn { position: absolute; bottom: 20px; right: 16px; z-index: 1001; background: linear-gradient(135deg, #8e44ad, #9b59b6); color: white; border: none; padding: 14px 22px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s; }
        #action-menu-panel { display: none; position: absolute; bottom: 80px; right: 16px; background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 1000; border: 2px solid #8e44ad; flex-direction: column; gap: 10px; width: 160px; }
        #action-menu-panel.show { display: flex; animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        #action-menu-panel button { width: 100%; color: white; border: none; padding: 11px 16px; border-radius: 30px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        #garden-btn { background: linear-gradient(135deg, #16a085, #1abc9c); }
        #checkin-btn { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        #collection-btn { background: linear-gradient(135deg, #f39c12, #d35400); }
        #scan-btn { background: linear-gradient(135deg, #2980b9, #3498db); }
        #real-scan-btn { background: linear-gradient(135deg, #8e44ad, #9b59b6); }
        #checkin-btn:disabled { background: #95a5a6; cursor: not-allowed; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 3000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 16px; width: 92%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .modal-content h3 { margin: 0 0 14px 0; color: #2c3e50; }
        #reader { width: 100%; min-height: 260px; background: #111; border-radius: 10px; overflow: hidden; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 14px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-confirm { background: #27ae60; color: white; }
        .btn-cancel { background: #bdc3c7; color: #2c3e50; }
        .enter-park-btn { margin-top: 10px; width: 100%; padding: 8px 12px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }

        /* 鏡頭縮放拉桿 */
        #zoom-container { display: none; margin-top: 15px; text-align: center; width: 100%; }
        #zoom-container label { color: #27ae60; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin-top: 12px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%; background: #27ae60; cursor: pointer; margin-top: -10px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); border: 2px solid white; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #bdc3c7; border-radius: 3px; }

        /* 卡牌與園圃系統 CSS */
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 60vh; overflow-y: auto; padding: 5px; }
        .tcg-card { background: linear-gradient(135deg, #2ecc71, #27ae60); border: 2px solid #f1c40f; border-radius: 8px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); text-align: center; padding: 5px; }
        .tcg-card.locked { background: #bdc3c7; border-color: #95a5a6; color: #7f8c8d; }
        .tcg-card .icon { font-size: 32px; margin-bottom: 5px; }
        #card-reveal-content { background: transparent; box-shadow: none; text-align: center; }
        
        .garden-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-height: 60vh; overflow-y: auto; padding: 5px; margin-top: 10px;}
        .garden-card { background: linear-gradient(135deg, #e8f8f5, #d1f2eb); border: 2px solid #1abc9c; border-radius: 12px; padding: 12px 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .garden-card h4 { margin: 5px 0; color: #16a085; font-size: 15px; }
        .garden-card .stage-icon { font-size: 36px; margin: 5px 0; display: block;}
        .garden-card .level-text { font-size: 12px; color: #34495e; font-weight: bold; margin-bottom: 10px; background: rgba(255,255,255,0.6); padding: 3px; border-radius: 4px;}
        .upgrade-btn { background: #2ecc71; color: white; border: none; padding: 8px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s;}
        .upgrade-btn:active { transform: scale(0.95); }
        .upgrade-btn.max { background: #f39c12; cursor: default; }

        .reveal-card { width: 200px; height: 280px; margin: 0 auto 20px; background: linear-gradient(135deg, #f1c40f, #f39c12); border: 5px solid #fff; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(241, 196, 15, 0.9); animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); color: #fff; }
        .reveal-card .icon { font-size: 60px; margin-bottom: 15px; }
        .reveal-card .title { font-size: 24px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .reveal-card .sub { font-size: 12px; margin-top: 10px; opacity: 0.9; }
        @keyframes popIn { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">正在從本機載入樹木資料...</div>
    </div>

    <!-- 2D 地圖 -->
    <div id="map"></div>

    <!-- 左下角定位按鈕 -->
    <button id="locate-btn">🎯</button>

    <!-- 3D 虛擬步行場景 -->
    <div id="scene3d-container">
        <div id="scene3d"></div>
        <div id="joystick-zone"></div>
        <div id="crosshair"></div>
        <div id="tree-info-panel"><h4 id="tip-name">樹名</h4><p id="tip-science">Scientific Name</p></div>
    </div>

    <!-- 左上角：玩家資源狀態 -->
    <div id="stats-panel">
        <div id="streak-info">連續簽到：0 天</div>
        <div id="fertilizer-display">🌱 肥料：0</div>
        <div id="species-count">📖 已收集：0 種</div>
    </div>

    <!-- 右上角：設定與公園內部導航按鈕 -->
    <button id="settings-btn">⚙️ 設定</button>
    <button id="switch-view-btn" class="top-right-btn">🗺️ 2D 樹木分佈</button>
    <button id="leave-park-btn" class="top-right-btn">🚪 離開公園</button>

    <div id="settings-panel">
        <h3>⚙️ 系統設定</h3>
        <div id="gps-status-box">
            <strong>📍 定位狀態：</strong><br>
            <span id="gps-status-text" style="color:#666;">準備中...</span>
        </div>
        <div class="dev-control">
            <label><input type="checkbox" id="mock-gps-toggle"> 啟用虛擬 GPS (開發模式)</label>
        </div>
        <div class="dev-control">
            <label for="park-select">傳送玩家至公園：</label>
            <select id="park-select" disabled><option value="">-- 請先開啟虛擬 GPS --</option></select>
        </div>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        <button id="reset-game-btn">🗑️ 重設遊戲資料</button>
    </div>

    <!-- 遊戲短暫提示 Toast -->
    <div id="toast-bar">準備中...</div>

    <!-- 右下角：行動選單 -->
    <button id="action-menu-btn">🎒 行動選單</button>
    <div id="action-menu-panel">
        <button id="checkin-btn">每日簽到</button>
        <button id="garden-btn">🏡 虛擬園圃</button>
        <button id="collection-btn">📖 我的卡牌</button>
        <button id="real-scan-btn">真實掃描 QR</button>
        <button id="scan-btn">模擬掃描</button>
    </div>

    <!-- 掃描 Modals -->
    <div id="real-scan-modal" class="modal">
        <div class="modal-content">
            <h3>掃描樹木 QR Code</h3>
            <div id="reader"></div>
            
            <div id="zoom-container">
                <label for="zoom-slider">🔍 鏡頭縮放</label>
                <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1">
            </div>

            <p id="scan-message" style="margin:10px 0 0; font-size:13px; color:#666; text-align:center;"></p>
            <div class="modal-buttons"><button class="btn-cancel" id="real-scan-close">關閉</button></div>
        </div>
    </div>

    <div id="scan-modal" class="modal">
        <div class="modal-content">
            <h3>手動輸入樹木名稱</h3>
            <p style="margin:0 0 12px 0; color:#666; font-size:14px;">請看著樹木標籤，輸入中文品種名稱</p>
            <input type="text" id="species-input" placeholder="例如：細葉榕、鳳凰木" autocomplete="off">
            <div class="modal-buttons">
                <button class="btn-cancel" id="scan-cancel">取消</button>
                <button class="btn-confirm" id="scan-confirm">確認收集</button>
            </div>
        </div>
    </div>

    <!-- 虛擬園圃 Modal -->
    <div id="garden-modal" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <h3 style="text-align: center; color: #16a085;">🏡 我的虛擬園圃</h3>
            <p style="text-align: center; font-size: 13px; color: #666;">消耗肥料讓你的樹苗成長茁壯！</p>
            <div class="garden-grid" id="garden-grid"></div>
            <div class="modal-buttons"><button class="btn-cancel" id="close-garden-btn">關閉園圃</button></div>
        </div>
    </div>

    <!-- 卡牌相關 Modals -->
    <div id="collection-modal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <h3 style="text-align: center; color: #27ae60;">🌳 樹木卡牌圖鑑</h3>
            <p style="text-align: center; font-size: 13px; color: #666;">探索公園並掃描 QR Code 來解鎖更多樹木！</p>
            <div class="card-grid" id="card-grid"></div>
            <div class="modal-buttons"><button class="btn-cancel" id="close-collection-btn">關閉圖鑑</button></div>
        </div>
    </div>

    <div id="card-reveal-modal" class="modal">
        <div class="modal-content" id="card-reveal-content">
            <h2 style="color: #fff; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);" id="reveal-title">解鎖新卡牌！</h2>
            <div class="reveal-card">
                <div class="icon">🌳</div>
                <div class="title" id="reveal-card-name">細葉榕</div>
                <div class="sub">★ 等級 1 幼苗 ★</div>
            </div>
            <div class="modal-buttons"><button class="btn-confirm" id="close-reveal-btn" style="background: #f1c40f; color: #000;">放入園圃</button></div>
        </div>
    </div>

    <!-- 載入外部腳本 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>

    <script>
        // ========== UI 互動與 Toast 提示系統 ==========
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const switchViewBtn = document.getElementById('switch-view-btn');
        const leaveParkBtn = document.getElementById('leave-park-btn');
        const locateBtn = document.getElementById('locate-btn');
        const gpsStatusText = document.getElementById('gps-status-text');
        const toastBar = document.getElementById('toast-bar');
        let toastTimeout;

        settingsBtn.addEventListener('click', () => { settingsPanel.classList.toggle('show'); });
        
        function showToast(msg) {
            toastBar.innerHTML = msg; toastBar.style.display = 'block';
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toastBar.style.display = 'none', 3500);
        }

        const actionMenuBtn = document.getElementById('action-menu-btn');
        const actionMenuPanel = document.getElementById('action-menu-panel');

        actionMenuBtn.addEventListener('click', () => {
            actionMenuPanel.classList.toggle('show');
            if(actionMenuPanel.classList.contains('show')) {
                actionMenuBtn.innerHTML = '❌ 關閉選單';
            } else {
                actionMenuBtn.innerHTML = '🎒 行動選單';
            }
        });

        document.querySelectorAll('#action-menu-panel button').forEach(btn => {
            btn.addEventListener('click', () => {
                actionMenuPanel.classList.remove('show');
                actionMenuBtn.innerHTML = '🎒 行動選單';
            });
        });

        // 定位按鈕點擊事件
        locateBtn.addEventListener('click', () => {
            map.flyTo([currentPlayerLat, currentPlayerLng], 16);
            showToast('📍 已置中目前位置');
        });

        // ========== 遊戲核心資料與設定 ==========
        const MAJOR_PARKS_URL = './Trees_Major_Parks_Trees_Major_Parks_converted.geojson';
        const STORAGE_KEY = 'dendro_hunter_save';

        let playerData = { fertilizer: 0, lastCheckinDate: null, streak: 0, totalCheckins: 0, collectedSpecies: [], treeLevels: {} };
        let html5QrCode = null;
        let currentParkName = null;
        let parksData = {}; 
        let isMockGps = false;
        let watchId = null;
        let currentPlayerLat = 22.3193;
        let currentPlayerLng = 114.1694;
        let is3DView = true;
        let isFirstGpsLock = true; // 追蹤是否為第一次取得 GPS

        const loadingEl = document.getElementById('loading');
        const parkSelect = document.getElementById('park-select');
        const mapDiv = document.getElementById('map');
        const sceneContainer = document.getElementById('scene3d-container');

        // ========== 玩家資料系統與重設功能 ==========
        function loadPlayerData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    playerData = { ...playerData, ...parsed };
                    if (!Array.isArray(playerData.collectedSpecies)) playerData.collectedSpecies = [];
                    if (!playerData.treeLevels) playerData.treeLevels = {};
                } catch(e) {}
            }
            updateUI();
        }

        function savePlayerData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(playerData));
            updateUI();
        }

        function updateUI() {
            document.getElementById('fertilizer-display').textContent = `🌱 肥料：${playerData.fertilizer}`;
            document.getElementById('streak-info').textContent = `連續簽到：${playerData.streak} 天`;
            document.getElementById('species-count').textContent = `📖 已收集：${playerData.collectedSpecies.length} 種`;
        }

        document.getElementById('reset-game-btn').addEventListener('click', () => {
            const confirmReset = confirm("⚠️ 警告：確定要刪除所有遊戲資料（包含收集的卡牌、肥料與園圃進度）嗎？此動作無法復原！");
            if (confirmReset) {
                localStorage.removeItem(STORAGE_KEY); 
                playerData = { fertilizer: 0, lastCheckinDate: null, streak: 0, totalCheckins: 0, collectedSpecies: [], treeLevels: {} };
                updateUI();

        function createMapFloor(scene, centerLat, centerLng) {
            const zoom = 17;
            const resolution = 156543.03392 * Math.cos(centerLat * Math.PI / 180) / Math.pow(2, zoom);
            const tileX_exact = (centerLng + 180) / 360 * Math.pow(2, zoom);
            const tileY_exact = (1 - Math.log(Math.tan(centerLat * Math.PI / 180) + 1 / Math.cos(centerLat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom);
            const tileX_int = Math.floor(tileX_exact); const tileY_int = Math.floor(tileY_exact);
            const offsetX = (tileX_exact - tileX_int) * 256; const offsetY = (tileY_exact - tileY_int) * 256;

            const canvas = document.createElement('canvas'); canvas.width = 768; canvas.height = 768;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = "#4CAF50"; ctx.fillRect(0, 0, 768, 768);

            const texture = new THREE.CanvasTexture(canvas);
            const floorSize = 768 * resolution;
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(floorSize, floorSize), new THREE.MeshLambertMaterial({ map: texture, color: 0xdddddd }));
            floor.rotation.x = -Math.PI / 2;
            
            const shiftX = (384 - (256 + offsetX)) * resolution; const shiftZ = (384 - (256 + offsetY)) * resolution; 
            floor.position.set(shiftX, 0, shiftZ);
            scene.add(floor);

            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    const img = new Image(); img.crossOrigin = "Anonymous";
                    img.onload = () => { ctx.drawImage(img, (dx + 1) * 256, (dy + 1) * 256, 256, 256); texture.needsUpdate = true; };
                    img.src = `https://tile.openstreetmap.org/${zoom}/${tileX_int + dx}/${tileY_int + dy}.png`;
                }
            }
        }

        function init3DScene(parkName, park) {
            try {
                const sceneDiv = document.getElementById('scene3d');
                sceneDiv.innerHTML = ''; 
                scene3D = new THREE.Scene(); scene3D.background = new THREE.Color(0x87CEEB); scene3D.fog = new THREE.Fog(0x87CEEB, 10, 150);
                camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera3D.rotation.order = 'YXZ'; 

                const latScale = 111000; 
                const lngScale = 111000 * Math.cos(park.lat * Math.PI / 180);
                let startX = (currentPlayerLng - park.lng) * lngScale;
                let startZ = -(currentPlayerLat - park.lat) * latScale;
                
                if (isNaN(startX)) startX = 0;
                if (isNaN(startZ)) startZ = 0;
                
                const distanceFromCenter = Math.sqrt(startX * startX + startZ * startZ);
                if (isMockGps || distanceFromCenter > 500) { startX = 0; startZ = 0; }
                camera3D.position.set(startX, 1.7, startZ); 

                renderer3D = new THREE.WebGLRenderer({ antialias: false }); renderer3D.setSize(window.innerWidth, window.innerHeight);
                renderer3D.setClearColor(0x87CEEB);
                sceneDiv.appendChild(renderer3D.domElement);

                scene3D.add(new THREE.AmbientLight(0xffffff, 0.7));
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(10, 20, 10); scene3D.add(dirLight);

                createMapFloor(scene3D, park.lat, park.lng);

                const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 8); const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5D4037 });
                const leavesGeo = new THREE.ConeGeometry(1.5, 3.5, 8); const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2E7D32 });

                if (Array.isArray(park.trees)) {
                    park.trees.slice(0, 300).forEach(tree => {
                        if (typeof tree.lng !== 'number' || typeof tree.lat !== 'number') return;
                        const x = (tree.lng - park.lng) * lngScale; const z = -(tree.lat - park.lat) * latScale;
                        const treeGroup = new THREE.Group();
                        const trunk = new THREE.Mesh(trunkGeo, trunkMat); trunk.position.y = 1; 
                        const leaves = new THREE.Mesh(leavesGeo, leavesMat); leaves.position.y = 3.5; 
                        const treeData = { chinese: tree.chinese, scientific: tree.scientific };
                        trunk.userData = treeData; leaves.userData = treeData;
                        treeGroup.add(trunk); treeGroup.add(leaves); treeGroup.position.set(x, 0, z); scene3D.add(treeGroup);
                    });
                }

                joystickManager = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '50%', top: '50%' }, color: 'white' });
                joystickManager.on('move', (evt, data) => { moveData.forward = Math.sin(data.angle.radian) * Math.min(data.force, 1); moveData.right = Math.cos(data.angle.radian) * Math.min(data.force, 1); });
                joystickManager.on('end', () => { moveData.forward = 0; moveData.right = 0; });

                let isDragging = false; let previousTouch = null; let startTouchTime = 0; let startTouchPos = { x: 0, y: 0 };
                sceneDiv.addEventListener('touchstart', (e) => { if (e.target.closest('#joystick-zone')) return; isDragging = true; previousTouch = e.touches[0]; startTouchTime = Date.now(); startTouchPos = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
                sceneDiv.addEventListener('touchmove', (e) => { if (!isDragging) return; e.preventDefault(); const touch = e.touches[0]; camera3D.rotation.y -= (touch.pageX - previousTouch.pageX) * 0.005; camera3D.rotation.x -= (touch.pageY - previousTouch.pageY) * 0.005; camera3D.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, camera3D.rotation.x)); previousTouch = touch; }, { passive: false });
                sceneDiv.addEventListener('touchend', (e) => {
                    isDragging = false;
                    if (e.changedTouches.length > 0) {
                        const touch = e.changedTouches[0]; const dx = touch.clientX - startTouchPos.x; const dy = touch.clientY - startTouchPos.y;
                        if (Math.sqrt(dx*dx + dy*dy) < 15 && (Date.now() - startTouchTime) < 350) checkTreeClick(touch.clientX, touch.clientY);
                    }
                });

                const dir = new THREE.Vector3(); const right = new THREE.Vector3();
                function animate() {
                    animationId3D = requestAnimationFrame(animate);
                    camera3D.getWorldDirection(dir); dir.y = 0; dir.normalize(); right.crossVectors(camera3D.up, dir).normalize();
                    if (moveData.forward !== 0 || moveData.right !== 0) { camera3D.position.addScaledVector(dir, moveData.forward * walkSpeed); camera3D.position.addScaledVector(right, -moveData.right * walkSpeed); }
                    renderer3D.render(scene3D, camera3D);
                }
                animate();
                showToast(`已成功進入「${parkName}」`);
            } catch (error) {
                console.error("3D 渲染失敗:", error);
                showToast("3D 場景載入失敗，已切換回 2D 模式");
                switchViewBtn.click(); 
            }
        }

        let treeTipTimeout = null;
        function checkTreeClick(clientX, clientY) {

                if (obj.userData && obj.userData.chinese) {
                    document.getElementById('tip-name').textContent = obj.userData.chinese || '未知品種'; document.getElementById('tip-science').textContent = obj.userData.scientific || '';
                    panel.style.display = 'block';
                    if(treeTipTimeout) clearTimeout(treeTipTimeout); treeTipTimeout = setTimeout(() => panel.style.display = 'none', 3000); return; 
                }
            }
            panel.style.display = 'none';
        }

        function startRealGPS() {
            if (!navigator.geolocation) {
                gpsStatusText.innerHTML = '<span style="color:#e74c3c;">❌ 不支援 GPS 定位</span>'; return;
            }
            gpsStatusText.innerHTML = '搜尋衛星訊號中...';
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    if (isMockGps) return;
                    currentPlayerLat = pos.coords.latitude; currentPlayerLng = pos.coords.longitude;
                    playerMarker.setLatLng([currentPlayerLat, currentPlayerLng]);
                    
                    // 首次抓到 GPS 時，地圖自動置中到玩家位置

                        map.setView([currentPlayerLat, currentPlayerLng], 16);

                    }
                    
                    gpsStatusText.innerHTML = `<span style="color:#27ae60;font-weight:bold;">🟢 成功</span><br><small>Lat: ${currentPlayerLat.toFixed(4)}<br>Lng: ${currentPlayerLng.toFixed(4)}</small>`;
                },
                (err) => {
                    if (isMockGps) return;
                    if (err.code === 1) { gpsStatusText.innerHTML = '<span style="color:#e74c3c;">❌ 權限被拒絕</span>'; }
                    else if (err.code === 2) { gpsStatusText.innerHTML = '<span style="color:#e74c3c;">❌ 無法獲取訊號</span>'; }
                    else if (err.code === 3) { gpsStatusText.innerHTML = '<span style="color:#e74c3c;">❌ 連線超時</span>'; }
                    else { gpsStatusText.innerHTML = `<span style="color:#e74c3c;">❌ ${err.message}</span>`; }
                }, 
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
            );
        }

        function collectSpecies(name) {
            const speciesName = name.replace(/[（(].*?[）)]/g, '').trim();
            if (!speciesName) return;

            if (playerData.collectedSpecies.includes(speciesName)) {

            } else {

                playerData.treeLevels[speciesName] = 1; 
                playerData.fertilizer += 2; 
                showToast(`成功收集新樹木！獲得 2 袋肥料 🌱`);
                
                document.getElementById('reveal-title').textContent = "解鎖新卡牌！"; 
                document.getElementById('reveal-card-name').textContent = speciesName;
                document.getElementById('card-reveal-modal').classList.add('show');

        async function fetchTreeNameFromURL(url) {
            try {
                const apiUrl = `https://dendro-hunter.vercel.app/api/get-tree?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error("API 回傳錯誤");
                const data = await response.json();
                
                if (data.name && data.name !== "未知樹木") {
                    let cleanName = data.name.split(/[,，、/]/)[0].replace(/[（(].*?[）)]/g, '').trim();
                    return cleanName;
                } else {
                    return null;
                }
            } catch (error) {
                console.error("呼叫 API 失敗:", error);
                return null;
            }
        }

        document.getElementById('real-scan-btn').addEventListener('click', async () => {
            const modal = document.getElementById('real-scan-modal');
            const msg = document.getElementById('scan-message');
            const zoomContainer = document.getElementById('zoom-container');
            const zoomSlider = document.getElementById('zoom-slider');
            
            modal.classList.add('show');
            msg.innerHTML = '正在請求相機權限...';
            zoomContainer.style.display = 'none';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                stream.getTracks().forEach(track => track.stop());
                msg.innerHTML = '相機啟動中...';
                html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, async (decodedText) => {
                    html5QrCode.stop().catch(()=>{}); 
                    zoomContainer.style.display = 'none';
                    
                    if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                        msg.innerHTML = '正在分析網址中的樹木資料...<br><div class="spinner" style="margin:10px auto; width:24px; height:24px;"></div>';
                        const extractedName = await fetchTreeNameFromURL(decodedText);
                        modal.classList.remove('show');
                        
                        if (extractedName && extractedName !== "未知樹木") {
                            collectSpecies(extractedName);
                        } else {
                            showToast('網站阻擋了自動讀取，請看著樹牌手動輸入');
                            document.getElementById('species-input').value = '';
                            document.getElementById('scan-modal').classList.add('show');
                        }
                    } else {
                        modal.classList.remove('show');
                        collectSpecies(decodedText);
                    }
                }, () => {});
                msg.innerHTML = '請將鏡頭對準樹上的 QR Code';

                setTimeout(() => {
                    const videoElement = document.querySelector('#reader video');
                    if (videoElement && videoElement.srcObject) {
                        const track = videoElement.srcObject.getVideoTracks()[0];
                        const capabilities = track.getCapabilities();
                        if (capabilities.zoom) {
                            zoomSlider.min = capabilities.zoom.min || 1;
                            zoomSlider.max = capabilities.zoom.max || 5;
                            zoomSlider.step = capabilities.zoom.step || 0.1;
                            zoomSlider.value = track.getSettings().zoom || 1;
                            zoomContainer.style.display = 'block';

                            zoomSlider.oninput = async (e) => {
                                try { await track.applyConstraints({ advanced: [{ zoom: parseFloat(e.target.value) }] }); } 
                                catch (err) { console.warn("無法應用縮放:", err); }
                            };
                        }
                    }
                }, 500);

            } catch (err) {
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') msg.innerHTML = '<span style="color:#e74c3c; font-weight:bold;">❌ 您拒絕了相機權限</span><br>請在瀏覽器設定中重新允許。';
                else if (!window.isSecureContext) msg.innerHTML = '<span style="color:#e74c3c; font-weight:bold;">❌ 瀏覽器安全限制</span><br>必須使用 HTTPS';
                else msg.innerHTML = `<span style="color:#e74c3c; font-weight:bold;">❌ 找不到相機或發生錯誤</span><br>${err.message}`;
            }
        });

        document.getElementById('real-scan-close').addEventListener('click', () => { 
            if (html5QrCode) html5QrCode.stop().catch(()=>{}); 
            document.getElementById('zoom-container').style.display = 'none';
            document.getElementById('real-scan-modal').classList.remove('show'); 
        });
        document.getElementById('scan-btn').addEventListener('click', () => { document.getElementById('species-input').value = ''; document.getElementById('scan-modal').classList.add('show'); });
        document.getElementById('scan-cancel').addEventListener('click', () => document.getElementById('scan-modal').classList.remove('show'));
        document.getElementById('scan-confirm').addEventListener('click', () => { const input = document.getElementById('species-input').value.trim(); if (input) { collectSpecies(input); document.getElementById('scan-modal').classList.remove('show'); } });

        // 啟動
        loadPlayerData();
        loadTreeData();
        startRealGPS();
    </script>
</body>
</html>
